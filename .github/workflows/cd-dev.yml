name: CD Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: FRONTEND QUALITY & BUILD VERIFICATION
  # ==========================================
  test:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./shoploc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Code formatting check (Prettier)
        run: npm run format:check

      - name: Code linting (ESLint)
        run: npm run lint

      - name: Type check (Astro & TypeScript)
        run: npm run check

      - name: Build frontend
        run: npm run build

  # ==========================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # ==========================================
  build-and-push:
    name: Build & Push Docker (Dev)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}:dev

  # ==========================================
  # JOB 3: DEPLOY TO K3S (DEV)
  # ==========================================
  deploy:
    name: Deploy to K3s Dev
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to K3s Dev
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          DEPLOYMENT_NAME: ${{ vars.K8S_DEPLOYMENT_NAME }}
          NAMESPACE: ${{ vars.K8S_NAMESPACE_DEV }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_CONTENT" > ~/.kube/config
          chmod 600 ~/.kube/config
          
          REPO="${GITHUB_REPOSITORY,,}"
          echo "Deploying to DEV ($NAMESPACE) for $DEPLOYMENT_NAME with image tag: dev"
          kubectl set image deployment/$DEPLOYMENT_NAME $DEPLOYMENT_NAME=ghcr.io/$REPO:dev -n $NAMESPACE
          
          # Force restart to ensure Kubernetes pulls the updated image tag
          kubectl rollout restart deployment/$DEPLOYMENT_NAME -n $NAMESPACE
